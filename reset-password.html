<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your Renshi password</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #262626;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --dim: #737373;
      --gold: #facc15;
      --success-bg: rgba(74, 222, 128, 0.08);
      --success-border: rgba(74, 222, 128, 0.45);
      --success-text: #86efac;
      --error-bg: rgba(252, 165, 165, 0.08);
      --error-border: rgba(252, 165, 165, 0.45);
      --error-text: #fca5a5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 64px 24px 48px;
    }
    .brand {
      text-align: center;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 3px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin: 0 0 12px;
      color: #fff;
    }
    p { color: #d4d4d4; margin: 0 0 14px; }
    p.lead { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 22px;
    }
    label {
      display: block;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f0f0f;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      transition: border-color 120ms ease;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: var(--gold);
    }
    .hint {
      color: var(--dim);
      font-size: 12px;
      margin-top: 8px;
    }
    button {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 0;
      background: var(--gold);
      color: #0a0a0a;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: inherit;
      margin-top: 20px;
      cursor: pointer;
      transition: opacity 120ms ease;
    }
    button:hover { opacity: 0.92; }
    button:active { opacity: 0.78; }
    button:disabled {
      background: #3f3f3f;
      color: #737373;
      cursor: not-allowed;
    }
    .msg {
      padding: 14px 16px;
      border-radius: 10px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.success {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }
    .msg.error {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }
    .msg strong { color: #fff; }
    .footer-note {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--dim);
      font-size: 12px;
      text-align: center;
    }
    .footer-note a {
      color: var(--muted);
      text-decoration: none;
    }
    .footer-note a:hover { color: var(--gold); }
    @media (max-width: 480px) {
      .wrap { padding: 48px 18px 32px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Renshi</div>
    <h1>Reset your password</h1>
    <p class="lead">Choose a new password for your Renshi account. After saving, return to the Renshi app to sign in.</p>

    <div class="card">
      <form id="form">
        <label for="pw">New password</label>
        <input id="pw" type="password" minlength="8" required autocomplete="new-password" />
        <p class="hint">At least 8 characters. Mix letters, numbers, and a symbol for best security.</p>
        <button type="submit" id="submit">Save new password</button>
      </form>
      <div id="msg"></div>
    </div>

    <div class="footer-note">
      Need help? <a href="mailto:renshicombat@yahoo.com">renshicombat@yahoo.com</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://tocyzsrywttbfbdcospp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvY3l6c3J5d3R0YmZiZGNvc3BwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NzE1OTMsImV4cCI6MjA5MjQ0NzU5M30.Zy3IubbLrjmCaFeZb0C2EctLUnIOF5e-fIe6UodZQTk";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { detectSessionInUrl: true, flowType: "pkce" }
    });

    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");
    const pwInput = document.getElementById("pw");

    function setMessage(kind, html) {
      msg.innerHTML = `<div class="msg ${kind}">${html}</div>`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submit.disabled = true;
      submit.textContent = "Saving…";
      msg.innerHTML = "";
      const password = pwInput.value;

      const { error } = await supabase.auth.updateUser({ password });

      submit.disabled = false;
      submit.textContent = "Save new password";

      if (error) {
        const friendly = /expired|invalid|not found/i.test(error.message || "")
          ? "This reset link has expired or already been used. Open the Renshi app, tap <strong>Forgot password</strong>, and request a new link."
          : error.message || "Reset failed. Try again.";
        setMessage("error", friendly);
        return;
      }

      setMessage(
        "success",
        "<strong>Password updated.</strong> You can close this tab and sign in to Renshi with your new password."
      );
      form.reset();
    });
  </script>
</body>
</html>
