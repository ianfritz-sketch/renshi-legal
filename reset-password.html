<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renshi — Reset Password</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #141414;
    border: 1px solid #3f3f3f;
    border-radius: 20px;
    padding: 32px 28px;
  }
  .kanji {
    font-size: 36px;
    font-weight: 300;
    text-align: center;
    letter-spacing: 1px;
    color: #ffffff;
    margin: 0 0 6px;
  }
  .wordmark {
    font-size: 28px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 4px;
    color: #ffffff;
    margin: 0 0 24px;
  }
  h1 {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-align: center;
    margin: 0 0 8px;
  }
  .sub {
    color: #a3a3a3;
    font-size: 14px;
    text-align: center;
    line-height: 20px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    color: #737373;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 12px 0 6px;
  }
  input {
    width: 100%;
    background: #0f0f0f;
    border: 1px solid #3f3f3f;
    border-radius: 10px;
    padding: 14px;
    color: #ffffff;
    font-size: 15px;
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus {
    outline: none;
    border-color: #ffffff;
  }
  button {
    width: 100%;
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 18px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 19px;
    text-align: center;
  }
  .msg.ok {
    background: rgba(34, 197, 94, 0.10);
    border: 1px solid #22c55e;
    color: #4ade80;
  }
  .msg.err {
    background: rgba(239, 68, 68, 0.10);
    border: 1px solid #ef4444;
    color: #fca5a5;
  }
  .footer {
    margin-top: 24px;
    text-align: center;
    color: #525252;
    font-size: 12px;
    line-height: 18px;
  }
  .footer a { color: #a3a3a3; text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="kanji">練士</div>
  <div class="wordmark">RENSHI</div>
  <h1>Set a New Password</h1>
  <p class="sub">Enter the new password you'd like to use for your Renshi account.</p>

  <form id="form">
    <label for="pw">New Password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="6" required>
    <label for="pw2">Confirm Password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
    <button id="submit" type="submit">Update Password</button>
  </form>

  <div id="msg"></div>

  <p class="footer">
    Done? Open the Renshi app and sign in with your new password.<br>
    Need help? <a href="mailto:renshicombat@yahoo.com">renshicombat@yahoo.com</a>
  </p>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://tocyzsrywttbfbdcospp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvY3l6c3J5d3R0YmZiZGNvc3BwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NzE1OTMsImV4cCI6MjA5MjQ0NzU5M30.Zy3IubbLrjmCaFeZb0C2EctLUnIOF5e-fIe6UodZQTk';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submit');
  const pw = document.getElementById('pw');
  const pw2 = document.getElementById('pw2');
  const msg = document.getElementById('msg');

  function show(kind, text) {
    msg.className = 'msg ' + kind;
    msg.textContent = text;
  }

  let hasToken = false;
  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
      hasToken = true;
    }
  });

  setTimeout(() => {
    if (!hasToken) {
      show('err', 'No recovery token found. Please request a new password reset link from the app.');
      submitBtn.disabled = true;
    }
  }, 600);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    show('', '');
    if (pw.value.length < 6) {
      show('err', 'Password must be at least 6 characters.');
      return;
    }
    if (pw.value !== pw2.value) {
      show('err', 'Passwords do not match.');
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';
    const { error } = await supabase.auth.updateUser({ password: pw.value });
    if (error) {
      show('err', error.message || 'Could not update password. Try again or request a new reset link.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
      return;
    }
    show('ok', 'Password updated. Open the Renshi app and sign in with your new password.');
    form.style.display = 'none';
  });
</script>
</body>
</html>
